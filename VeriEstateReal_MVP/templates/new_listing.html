{% extends 'base.html' %}{% block title %}Add listing · VeriEstateReal{% endblock %}{% block content %}<div class="page-header"><div><div class="eyebrow">LISTING INTAKE</div><h1>Add a property listing</h1><p class="lead">Enter available details. This saves information only; it does not authenticate ownership.</p></div></div><form class="form-card" method="post"><div class="form-grid"><label class="full">Listing title <em>*</em><input name="title" required value="{{ values.get('title','') }}" placeholder="e.g. Demo Listing — Lakeview Apartment"></label><label class="full">Address <em>*</em><input name="address" required value="{{ values.get('address','') }}" placeholder="Street, building, unit or plot details"></label><label>Locality <em>*</em><input name="locality" required value="{{ values.get('locality','') }}" placeholder="Locality"></label><label>City <em>*</em><input name="city" required value="{{ values.get('city','') }}" placeholder="City"></label><label>State / region<input name="state" value="{{ values.get('state','') }}" placeholder="State"></label><label>Property type <em>*</em><select name="property_type" required><option value="">Select type</option>{% for type in ['Apartment','Villa','Plot','Independent House','Other'] %}<option {% if values.get('property_type')==type %}selected{% endif %}>{{ type }}</option>{% endfor %}</select></label><label>Area (sq ft)<input name="area_sqft" type="number" min="1" step="0.01" value="{{ values.get('area_sqft','') }}" placeholder="e.g. 980"></label><label>Property identifier (if available)<input name="property_id" value="{{ values.get('property_id','') }}" placeholder="Identifier as supplied"></label><label class="full">Description<textarea name="description" rows="3" placeholder="Optional listing description">{{ values.get('description','') }}</textarea></label></div><div class="form-actions"><a class="button secondary" href="{{ url_for('listings') }}">Cancel</a><button class="button primary" type="submit">Save listing</button></div></form>{% endblock %}
